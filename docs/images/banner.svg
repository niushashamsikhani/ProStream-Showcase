<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="ProStream: intelligent automotive assembly process and time-estimation platform" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1124"/>
      <stop offset="1" stop-color="#15234a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="260" fill="url(#glow)"/>

  <!-- zone network motif (14 nodes) -->
  <g stroke="#5b8cff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M760 70 L830 45 L905 90 L980 55 L1060 95 L1125 60"/>
    <path d="M905 90 L950 135 L870 165 L790 140"/>
    <path d="M950 135 L1030 175 L1105 140 L1060 95"/>
    <path d="M870 165 L925 210 L1010 225 L1030 175"/>
    <path d="M870 165 L830 215"/>
  </g>
  <g fill="#5b8cff">
    <circle cx="760" cy="70" r="4"/><circle cx="830" cy="45" r="4"/>
    <circle cx="980" cy="55" r="4"/><circle cx="1060" cy="95" r="4"/>
    <circle cx="1125" cy="60" r="4"/><circle cx="790" cy="140" r="4"/>
    <circle cx="870" cy="165" r="4"/><circle cx="1105" cy="140" r="4"/>
    <circle cx="830" cy="215" r="4"/><circle cx="925" cy="210" r="4"/>
    <circle cx="1010" cy="225" r="4"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="905" cy="90" r="7"/><circle cx="950" cy="135" r="7"/><circle cx="1030" cy="175" r="7"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="72" font-size="13" letter-spacing="3" fill="#7aa2ff" font-weight="600">AUTOMOTIVE  ·  INDUSTRIAL ENGINEERING  ·  AI</text>
    <text x="64" y="150" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1">ProStream</text>
    <text x="64" y="196" font-size="21" fill="#c9d4ee">Intelligent assembly process and time-estimation platform</text>
    <text x="64" y="230" font-size="16" fill="#8b9bbd">Standard times from process sheets, with no stopwatch on the line.</text>

    <!-- flow -->
    <g>
      <rect x="64" y="274" width="330" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#2b3a63"/>
      <rect x="64" y="274" width="5" height="76" rx="2.5" fill="#5b8cff"/>
      <text x="92" y="306" font-size="19" font-weight="700" fill="#ffffff">Extract</text>
      <text x="92" y="331" font-size="13.5" fill="#9fb0d3">OCR + NLP read process sheets</text>

      <rect x="435" y="274" width="330" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#2b3a63"/>
      <rect x="435" y="274" width="5" height="76" rx="2.5" fill="#2dd4bf"/>
      <text x="463" y="306" font-size="19" font-weight="700" fill="#ffffff">Estimate</text>
      <text x="463" y="331" font-size="13.5" fill="#9fb0d3">MTM · BasicMOST · calibrated heuristics</text>

      <rect x="806" y="274" width="330" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#2b3a63"/>
      <rect x="806" y="274" width="5" height="76" rx="2.5" fill="#a78bfa"/>
      <text x="834" y="306" font-size="19" font-weight="700" fill="#ffffff">Explore</text>
      <text x="834" y="331" font-size="13.5" fill="#9fb0d3">AI-zoned 3D explorer and reports</text>
    </g>
  </g>

  <g stroke="#5b8cff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M406 312 L423 312 M417 305 L424 312 L417 319"/>
    <path d="M777 312 L794 312 M788 305 L795 312 L788 319"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
